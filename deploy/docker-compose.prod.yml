services:
  api:
    restart: unless-stopped
    environment:
      INGEST_API_KEY: ${INGEST_API_KEY:?set in .env.prod}

  frontend:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env.prod}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env.prod}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env.prod}
      WEB_DOMAIN: ${WEB_DOMAIN:?set in .env.prod}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?set in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
      - grafana

volumes:
  caddy-data:
  caddy-config:
