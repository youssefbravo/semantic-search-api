# Shared environment for the api + worker (DRY via a YAML anchor).
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/semantic_search
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  REDIS_VISIBILITY_TIMEOUT_SECONDS: 300
  UPLOAD_DIR: /data/uploads
  OPENBLAS_NUM_THREADS: 2
  OMP_NUM_THREADS: 2
  MKL_NUM_THREADS: 2
  METRICS_ENABLED: "true"

services:
  postgres:
    # ParadeDB bundles BOTH pgvector and pg_search (BM25) in one image, so a single
    # database serves semantic AND lexical retrieval — no separate search engine.
    image: paradedb/paradedb@sha256:371e180894738e563404f10486835bcd86ca08eb36af1005bd69a1b0bedb40fe
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_search
    volumes:
      # PG18+ (ParadeDB latest) stores data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic_search"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    image: semantic-search-api:portfolio
    # Initialise the schema (extensions + tables + HNSW/BM25 indexes) once Postgres
    # is healthy, then serve. init_db is idempotent.
    command: sh -c "python -m scripts.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *app-env
    volumes:
      - .:/app                 # live code + benchmark results land on the host
      - uploads:/data/uploads  # shared with the worker
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: semantic-search-frontend:portfolio
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

  worker:
    build: .
    image: semantic-search-api:portfolio  # same image as api; built once
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=2
    environment: *app-env
    volumes:
      - .:/app
      - uploads:/data/uploads  # reads the raw bytes staged by the api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  uploads:
  prometheus-data:
  grafana-data:
